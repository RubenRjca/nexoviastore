<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexovia Store | Gadgets con Pago Contra Entrega en toda Venezuela</title>
<meta name="description" content="Gadgets y accesorios tech con envíos a toda Venezuela. Elige tu producto y paga cuando lo recibas: Pago Contra Entrega.">
<meta name="theme-color" content="#2C5D76">
<link rel="canonical" href="https://www.nexovia.store/">
<link rel="icon" type="image/png" href="assets/isotipo.png">
<link rel="apple-touch-icon" href="assets/isotipo.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
.nx-install-banner{position:fixed;z-index:1000;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border:1px solid rgba(44,93,118,.18);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(44,93,118,.16);color:#444444;font-size:13px}
.nx-install-banner img{width:38px;height:38px;border-radius:9px;object-fit:contain}
.nx-install-copy{flex:1;min-width:0;font-weight:700}
.nx-install-action,.nx-install-close{font:inherit;border:0;cursor:pointer;border-radius:9px}
.nx-install-action{padding:8px 11px;background:#ED7F61;color:#fff;font-weight:700}
.nx-install-action:hover{background:#D96B4D}
.nx-install-close{width:32px;height:32px;background:transparent;color:#6B7378;font-size:20px;line-height:1}.nx-install-close:hover{background:#F8F8F8}
@media(max-width:520px){.nx-install-copy{font-size:12px}.nx-install-action{padding:8px}.nx-install-banner{gap:6px}}
</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').catch(() => {});
  });
}
</script>
